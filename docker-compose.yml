services:
  # Production: static build served by nginx (no hot reload)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_SERVER_HOST: ${REACT_APP_SERVER_HOST:-http://localhost:3000}
    image: task-manager-frontend
    ports:
      - "${FRONTEND_PORT:-3005}:80"
    restart: unless-stopped

  # Development: CRA webpack-dev-server with hot reload
  # Usage: docker compose up frontend-dev --build
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: task-manager-frontend-dev
    ports:
      - "${FRONTEND_PORT:-3005}:3005"
    environment:
      HOST: "0.0.0.0"
      PORT: "3005"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "3005"
      REACT_APP_SERVER_HOST: ${REACT_APP_SERVER_HOST:-http://localhost:3000}
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    profiles: ["dev"]

volumes:
  frontend_node_modules:
